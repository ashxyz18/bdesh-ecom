# Cloudflare Pages Configuration for Next.js
# This file configures the Wrangler CLI for Cloudflare Pages deployment

name = "bdesh-ecommerce"
main = "functions/_middleware.ts"

# Build configuration
[build]
command = "npm run build:cloudflare"
cwd = "."

# Environment configuration for production
[env.production]
vars = { NODE_ENV = "production", ENVIRONMENT = "production" }

# Environment configuration for staging
[env.staging]
vars = { NODE_ENV = "staging", ENVIRONMENT = "staging" }

# Compatibility settings for Node.js
compatibility_date = "2024-12-19"
compatibility_flags = ["nodejs_compat"]

# Routes configuration
[[routes]]
pattern = "example.com/*"
zone_name = "example.com"

[[routes]]
pattern = "staging.example.com/*"
zone_name = "example.com"
