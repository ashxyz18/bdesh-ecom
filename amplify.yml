version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - cd frontend/web && npm run build
  artifacts:
    baseDirectory: frontend/web/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - frontend/web/node_modules/**/*
