services:
  # PostgreSQL database
  - type: postgres
    name: bdesh-ecom-db
    databaseName: bdesh_ecom
    user: admin
    plan: free

  # Next.js web service (using Dockerfile)
  - type: web
    name: bdesh-ecom-web
    env: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_TURBOPACK
        value: "0"
      - key: NEXT_PUBLIC_APP_URL
        value: https://bdesh-ecom-web.onrender.com
      - key: NEXT_PUBLIC_BASE_URL
        value: https://bdesh-ecom-web.onrender.com
      - key: DATABASE_URL
        fromService:
          type: psql
          name: bdesh-ecom-db
          envVarKey: DATABASE_URL
