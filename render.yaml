services:
  - type: web
    name: bdesh-ecom-web
    env: docker
    plan: free
    healthCheckPath: /api/health
    buildCommand: "npm run build"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PURBOPACK
        value: "0"
      - key: NEXT_PUBLIC_APP_URL
        value: https://bdesh-ecom-web.onrender.com
      - key: NEXT_PUBLIC_BASE_URL
        value: https://bdesh-ecom-web.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://bdesh-ecom-web.onrender.com
      # Add DATABASE_URL from Render's PostgreSQL service
      - key: DATABASE_URL
        fromDatabase:
          name: bdesh-ecom-db
          property: connectionString
      # Add REDIS_URL if using Redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: bdesh-ecom-redis
          property: connectionString

databases:
  - name: bdesh-ecom-db
    databaseName: bdesh_ecom
    plan: free
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        value: https://bdesh-ecom-web.onrender.com
      # Note: DATABASE_URL should be added manually from your PostgreSQL service
      - key: DATABASE_URL
        sync: false
