[build]
  builder = "dockerfile"

[deploy]
  healthcheckPath = "/api/health"
  healthcheckTimeout = 300
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3

[env]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  PORT = "3000"

# Set these variables in Railway dashboard (Variables section):
# DATABASE_URL - Supabase pooled connection (port 6543, pgbouncer=true)
# DIRECT_URL - Supabase direct connection (port 5432)
# NEXT_PUBLIC_SUPABASE_URL - Your Supabase project URL
# NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY - Your Supabase anon/public key
# NEXTAUTH_SECRET - A random secret for NextAuth.js (generate: openssl rand -base64 32)
# NEXTAUTH_URL - Your Railway app URL (e.g., https://your-app.up.railway.app)
